<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <mask id="slash-cut">
      <rect width="100" height="100" fill="white" />
      <line x1="35" y1="35" x2="95" y2="95" stroke="black" stroke-width="20" stroke-linecap="butt" />
    </mask>
  </defs>
  
  <g stroke="#09090b" fill="none">
    <!-- D vertical stem -->
    <line x1="22" y1="12" x2="22" y2="88" stroke-width="6" stroke-linecap="butt" />
    
    <!-- D curved body with negative space cut -->
    <path d="M 32 22 A 28 28 0 0 1 32 78" stroke-width="20" stroke-linecap="butt" mask="url(#slash-cut)" />
    
    <!-- Q diagonal tail -->
    <line x1="44" y1="44" x2="84" y2="84" stroke-width="6" stroke-linecap="butt" />
  </g>
</svg>